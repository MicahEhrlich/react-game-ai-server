services:
  - type: web
    name: react-game-ai-server
    runtime: node
    rootDir: .
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run typecheck
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: react-game-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: react-game-ai-redis
          property: connectionString

  - type: keyvalue
    name: react-game-ai-redis
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: react-game-ai-db
    plan: starter
